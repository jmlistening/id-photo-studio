name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run smoke tests
        run: python tests/smoke.py

  powershell:
    name: PowerShell launcher syntax
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse server.ps1 with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [System.IO.File]::ReadAllBytes('server.ps1')
          $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
          if (-not $hasBom) {
            $nonAscii = @($bytes | Where-Object { $_ -gt 127 })
            if ($nonAscii.Count -gt 0) {
              throw 'server.ps1 must be pure ASCII, or UTF-8 with a BOM, so Windows PowerShell 5.1 can parse it.'
            }
          }
          [scriptblock]::Create((Get-Content -Raw server.ps1)) | Out-Null
          Write-Host 'server.ps1 parses under Windows PowerShell 5.1'
